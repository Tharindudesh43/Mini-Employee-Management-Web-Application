<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17262d">
  <title>Log in - PeopleDesk</title>
  <link rel="icon" type="image/png" href="/LogoWeb.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">
  <main class="login-card">
    <h1>PeopleDesk</h1>
    <p class="login-card__intro">Log in to manage your employees.</p>

    <p class="notice notice--info" id="expired-notice" role="status" hidden>Your session ended because of inactivity. Log in again to continue.</p>
    <p class="notice notice--error" id="login-error" role="alert" hidden></p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" class="input" autocomplete="username" autofocus required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="input" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn--primary" id="login-btn">Log in</button>
    </form>
  </main>
  <script type="module" src="js/login.js"></script>
</body>
</html>
